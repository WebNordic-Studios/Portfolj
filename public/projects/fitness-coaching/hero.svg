<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="240" y1="60" x2="1360" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090F"/>
      <stop offset="1" stop-color="#0A0B14"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="120" x2="1340" y2="780" gradientUnits="userSpaceOnUse">
