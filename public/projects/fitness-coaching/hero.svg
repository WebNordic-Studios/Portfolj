  <rect x="1030" y="682" width="260" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1030" y="708" width="160" height="30" rx="14" fill="rgba(167,139,250,0.14)"/>
  <text x="1045" y="728" fill="rgba(255,255,255,0.78)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
