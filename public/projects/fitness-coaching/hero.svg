  <rect x="1010" y="535" width="370" height="215" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <text x="1030" y="570" fill="rgba(255,255,255,0.60)" font-size="12" letter-spacing="2.0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
