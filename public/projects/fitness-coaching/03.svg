  </text>
  <rect x="890" y="490" width="420" height="260" rx="24" fill="url(#accent)" opacity="0.10" stroke="rgba(255,255,255,0.10)"/>
  <text x="910" y="540" fill="rgba(255,255,255,0.70)" font-size="12" letter-spacing="2.0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
