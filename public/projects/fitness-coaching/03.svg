  </text>

  <rect x="290" y="470" width="380" height="44" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  <text x="310" y="498" fill="rgba(255,255,255,0.45)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Goal (fat loss / strength / performance)
  </text>
  <rect x="290" y="524" width="380" height="44" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  <text x="310" y="552" fill="rgba(255,255,255,0.45)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
