  </text>
  <rect x="910" y="565" width="120" height="36" rx="14" fill="rgba(255,255,255,0.10)"/>
  <rect x="1040" y="565" width="120" height="36" rx="14" fill="rgba(255,255,255,0.06)"/>
  <rect x="1170" y="565" width="120" height="36" rx="14" fill="rgba(255,255,255,0.06)"/>
  <rect x="910" y="615" width="380" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
  <rect x="910" y="635" width="340" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="910" y="655" width="360" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>

  <rect x="890" y="770" width="420" height="68" rx="24" fill="rgba(96,165,250,0.18)" stroke="rgba(255,255,255,0.10)"/>
  <text x="960" y="812" fill="rgba(255,255,255,0.88)" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
