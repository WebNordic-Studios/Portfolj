  </text>

  <!-- Phone 1: intake -->
  <rect x="250" y="290" width="460" height="720" rx="34" fill="rgba(0,0,0,0.25)"/>
  <rect x="270" y="310" width="420" height="130" rx="24" fill="url(#accent)" opacity="0.14" stroke="rgba(255,255,255,0.10)"/>
  <text x="290" y="365" fill="rgba(255,255,255,0.92)" font-size="18" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
