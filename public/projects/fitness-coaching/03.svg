  </text>
  <rect x="290" y="578" width="380" height="44" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  <text x="310" y="606" fill="rgba(255,255,255,0.45)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Injuries / limitations
  </text>
  <rect x="290" y="650" width="380" height="52" rx="20" fill="rgba(96,165,250,0.18)" stroke="rgba(255,255,255,0.10)"/>
  <text x="350" y="683" fill="rgba(255,255,255,0.88)" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Continue →
  </text>

  <!-- Phone 2: booking -->
  <rect x="870" y="290" width="460" height="720" rx="34" fill="rgba(0,0,0,0.25)"/>
  <rect x="890" y="310" width="420" height="160" rx="24" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
  <text x="910" y="360" fill="rgba(255,255,255,0.86)" font-size="16" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
