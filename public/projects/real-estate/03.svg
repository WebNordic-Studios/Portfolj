  </text>

  <!-- Phone 1 -->
  <rect x="250" y="290" width="460" height="720" rx="34" fill="rgba(0,0,0,0.25)"/>
  <rect x="270" y="310" width="420" height="210" rx="24" fill="url(#accent)" opacity="0.18" stroke="rgba(255,255,255,0.10)"/>
