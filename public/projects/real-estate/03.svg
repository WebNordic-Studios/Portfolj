<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="220" y1="120" x2="1420" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A0A"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="240" x2="1400" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1100" rx="48" fill="url(#bg)"/>
  <rect x="220" y="150" width="520" height="900" rx="46" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <rect x="840" y="150" width="520" height="900" rx="46" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>

  <text x="260" y="215" fill="rgba(255,255,255,0.60)" font-size="12" letter-spacing="2.2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
