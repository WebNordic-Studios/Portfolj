  <rect x="910" y="585" width="320" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="910" y="605" width="340" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>

  <rect x="890" y="740" width="420" height="92" rx="24" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)"/>
  <text x="910" y="780" fill="rgba(255,255,255,0.86)" font-size="14" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
