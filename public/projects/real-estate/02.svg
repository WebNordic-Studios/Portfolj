  <rect x="1030" y="432" width="105" height="30" rx="14" fill="rgba(34,211,238,0.14)"/>
  <rect x="1145" y="432" width="105" height="30" rx="14" fill="rgba(255,255,255,0.06)"/>
  <rect x="1260" y="432" width="110" height="30" rx="14" fill="rgba(167,139,250,0.12)"/>
