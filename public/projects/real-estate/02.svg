  <rect x="1030" y="780" width="260" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1030" y="812" width="340" height="70" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  <text x="1050" y="852" fill="rgba(255,255,255,0.70)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
