<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="220" y1="120" x2="1420" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060A0A"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="220" x2="1400" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
