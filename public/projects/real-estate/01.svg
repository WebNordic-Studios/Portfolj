  <g>
    <rect x="220" y="390" width="380" height="250" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="240" y="410" width="340" height="140" rx="16" fill="url(#photo)"/>
    <rect x="240" y="565" width="170" height="14" rx="7" fill="rgba(255,255,255,0.12)"/>
