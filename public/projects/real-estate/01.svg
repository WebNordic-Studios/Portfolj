    <rect x="1040" y="410" width="340" height="140" rx="16" fill="url(#photo)"/>
    <rect x="1040" y="565" width="160" height="14" rx="7" fill="rgba(255,255,255,0.12)"/>
    <rect x="1040" y="590" width="230" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
    <rect x="1040" y="612" width="120" height="26" rx="12" fill="rgba(255,255,255,0.08)"/>
    <text x="1054" y="631" fill="rgba(255,255,255,0.70)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
