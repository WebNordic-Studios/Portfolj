    <rect x="620" y="390" width="380" height="250" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="640" y="410" width="340" height="140" rx="16" fill="url(#photo)"/>
    <rect x="640" y="565" width="190" height="14" rx="7" fill="rgba(255,255,255,0.12)"/>
    <rect x="640" y="590" width="240" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
    <rect x="640" y="612" width="120" height="26" rx="12" fill="rgba(167,139,250,0.14)"/>
