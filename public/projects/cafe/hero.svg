<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="220" y1="80" x2="1380" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0706"/>
      <stop offset="1" stop-color="#0A0711"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="130" x2="1340" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1680" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="44" fill="url(#bg)"/>
  <g filter="url(#shadow)" opacity="0.9">
    <circle cx="430" cy="260" r="210" fill="url(#accent)" opacity="0.18"/>
    <circle cx="1240" cy="610" r="260" fill="url(#accent)" opacity="0.14"/>
  </g>

  <!-- Browser frame -->
  <rect x="200" y="120" width="1200" height="660" rx="26" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <rect x="232" y="152" width="250" height="12" rx="6" fill="rgba(255,255,255,0.10)"/>
  <rect x="232" y="180" width="420" height="10" rx="5" fill="rgba(255,255,255,0.07)"/>

  <!-- Top nav -->
  <text x="250" y="230" fill="rgba(255,255,255,0.92)" font-size="18" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Ember Café
  </text>
  <text x="1100" y="230" fill="rgba(255,255,255,0.55)" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Menu   Hours   Events   Contact
  </text>
  <rect x="1250" y="210" width="130" height="34" rx="17" fill="rgba(245,158,11,0.16)" stroke="rgba(255,255,255,0.10)"/>
  <text x="1268" y="233" fill="rgba(255,255,255,0.86)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Book a table →
  </text>

  <!-- Hero -->
  <text x="250" y="285" fill="rgba(255,255,255,0.60)" font-size="12" letter-spacing="2.2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    CAFÉ · MENU + LOCAL SEO
  </text>
  <text x="250" y="340" fill="rgba(255,255,255,0.94)" font-size="42" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Coffee, pastries —
  </text>
  <text x="250" y="388" fill="rgba(255,255,255,0.94)" font-size="42" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    and a menu that’s easy.
  </text>
  <text x="250" y="425" fill="rgba(255,255,255,0.62)" font-size="16" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Hours, location, and booking are always one scroll away.
  </text>

  <!-- Quick info pills -->
  <rect x="250" y="455" width="210" height="40" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  <text x="268" y="480" fill="rgba(255,255,255,0.70)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Open today: 07–18
  </text>
  <rect x="470" y="455" width="250" height="40" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
  <text x="488" y="480" fill="rgba(255,255,255,0.70)" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    12 Harbor St · Get directions →
  </text>

  <!-- Menu preview -->
  <rect x="250" y="525" width="620" height="225" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <text x="270" y="560" fill="rgba(255,255,255,0.60)" font-size="12" letter-spacing="2.0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    MENU
  </text>
  <text x="270" y="592" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Espresso · Filter · Signature
  </text>
  <rect x="270" y="612" width="560" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
  <rect x="270" y="632" width="520" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="270" y="662" width="560" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
  <rect x="270" y="682" width="470" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="270" y="712" width="180" height="32" rx="14" fill="rgba(245,158,11,0.16)"/>
  <text x="290" y="733" fill="rgba(255,255,255,0.80)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    View full menu →
  </text>

  <!-- Photo + events -->
  <rect x="890" y="525" width="488" height="225" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)"/>
  <rect x="910" y="545" width="210" height="190" rx="18" fill="url(#photo)"/>
  <text x="1135" y="575" fill="rgba(255,255,255,0.88)" font-size="15" font-weight="650" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    Events this week
  </text>
  <rect x="1135" y="595" width="220" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
  <rect x="1135" y="615" width="190" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1135" y="650" width="220" height="10" rx="5" fill="rgba(255,255,255,0.10)"/>
  <rect x="1135" y="670" width="160" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="1135" y="705" width="160" height="32" rx="14" fill="rgba(167,139,250,0.14)"/>
  <text x="1155" y="726" fill="rgba(255,255,255,0.78)" font-size="12" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto">
    See all →
  </text>
</svg>

